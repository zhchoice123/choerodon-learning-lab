# HTTPS server 块；先加载 nginx-cloud-limits.conf 中的 http 级共享区。
location = /choerodon { return 308 /choerodon/; }
location = /choerodon/ws { return 404; }
location ^~ /choerodon/ {
    include /etc/nginx/snippets/choerodon-cloud-proxy.conf;
}
location ^~ /__learn/api/ {
    limit_req zone=choerodon_api burst=30 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/choerodon-cloud-proxy.conf;
}
location ^~ /__learn/ {
    include /etc/nginx/snippets/choerodon-cloud-proxy.conf;
}
location ^~ /mock/ {
    limit_req zone=choerodon_api burst=30 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/choerodon-cloud-proxy.conf;
}
