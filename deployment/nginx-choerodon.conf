# Include inside the existing zhchoice.xyz HTTPS server block.
# All application resources, API writes, mocks and WebSocket share password protection.
# Reserved root prefixes /__learn/ and /mock/ preserve the fixed lesson source URLs.
location = /choerodon {
    return 308 /choerodon/;
}
# CRA 的 WDS_SOCKET_PATH 只设置浏览器端路径，服务器仍监听 /ws。
location = /choerodon/ws {
    rewrite ^ /ws break;
    include /etc/nginx/snippets/choerodon-auth-proxy.conf;
}
location ^~ /choerodon/ {
    include /etc/nginx/snippets/choerodon-auth-proxy.conf;
}
location ^~ /__learn/ {
    include /etc/nginx/snippets/choerodon-auth-proxy.conf;
}
location ^~ /mock/ {
    include /etc/nginx/snippets/choerodon-auth-proxy.conf;
}
